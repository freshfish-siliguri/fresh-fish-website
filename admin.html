
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRESH FISH | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f3;font-family:Arial,sans-serif;color:#18352b}
header{background:#087f5b;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #0000000a}
input,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd9d2;border-radius:7px}
button{padding:11px 16px;border:0;border-radius:7px;background:#087f5b;color:white;cursor:pointer;font-weight:bold}
button.danger{background:#c0392b}
button.secondary{background:#607d70}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.product{border:1px solid #e3eae6;padding:14px;border-radius:10px}
.product img{width:100%;height:140px;object-fit:cover;border-radius:7px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.hidden{display:none}
small{color:#64766e}
#message{margin:12px 0;color:#087f5b}
</style>
</head>
<body>

<header>
<h2>🐟 FRESH FISH ADMIN</h2>
<button id="logout" class="hidden">Logout</button>
</header>

<main>

<section class="card" id="loginBox">
<h2>Admin Login</h2>
<p>Sign in with your registered Admin account.</p>
<input type="email" id="email" placeholder="Admin Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<div id="loginMessage"></div>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h2>Product Management</h2>
<p><small>Add and manage products in your FRESH FISH store.</small></p>

<form id="productForm">
<input type="hidden" id="productId">

<label>Product Name</label>
<input id="name" required placeholder="Example: Rohu Fish">

<label>Category</label>
<select id="category" required>
<option value="Fish">Fish</option>
<option value="Chicken">Chicken</option>
<option value="Mutton">Mutton</option>
<option value="Eggs">Eggs</option>
<option value="Grocery">Grocery</option>
</select>

<label>Price (₹)</label>
<input type="number" id="price" min="0.01" step="0.01" required>

<label>Unit</label>
<select id="unit">
<option value="kg">Per kg</option>
<option value="piece">Per piece</option>
<option value="12 pcs">12 pieces</option>
<option value="500 g">500 grams</option>
</select>

<label>Stock Quantity</label>
<input type="number" id="stock" min="0" value="10" required>

<label>Product Image URL</label>
<input type="url" id="image" placeholder="https://example.com/image.jpg">

<label>
<input type="checkbox" id="active" checked style="width:auto">
 Product available for customers
</label>

<button type="submit" id="saveBtn">ADD PRODUCT</button>
<button type="button" id="cancelBtn" class="secondary hidden">CANCEL EDIT</button>
</form>
<div id="message"></div>
</div>

<div class="card">
<h2>All Products</h2>
<div id="productList" class="grid">Loading products...</div>
</div>

<div class="card">
<h2>Orders</h2>
<p>Customer order management will be connected in the next stage.</p>
</div>

</section>
</main>

<script type="module">
import {auth,db} from "./firebase-config.js";
import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
 collection,addDoc,getDocs,updateDoc,deleteDoc,
 doc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const $=id=>document.getElementById(id);

let editingId=null;

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

onAuthStateChanged(auth,user=>{
 $("loginBox").classList.toggle("hidden",!!user);
 $("dashboard").classList.toggle("hidden",!user);
 $("logout").classList.toggle("hidden",!user);
 if(user)loadProducts();
});

$("loginBtn").onclick=async()=>{
 $("loginMessage").textContent="Signing in...";
 try{
  await signInWithEmailAndPassword(auth,$("email").value,$("password").value);
  $("loginMessage").textContent="Login successful.";
 }catch(e){
  $("loginMessage").textContent="Login failed: "+e.message;
 }
};

$("logout").onclick=()=>signOut(auth);

$("productForm").onsubmit=async e=>{
 e.preventDefault();
 const user=auth.currentUser;
 if(!user)return;

 const data={
  name:$("name").value.trim(),
  category:$("category").value,
  price:Number($("price").value),
  unit:$("unit").value,
  stock:Number($("stock").value),
  image:$("image").value.trim(),
  active:$("active").checked,
  updatedAt:serverTimestamp()
 };

 if(!data.name||!Number.isFinite(data.price)||data.price<=0||
 !Number.isInteger(data.stock)||data.stock<0){
  $("message").textContent="Please enter valid product details.";
  return;
 }

 $("saveBtn").disabled=true;
 try{
  if(editingId){
   await updateDoc(doc(db,"products",editingId),data);
   $("message").textContent="Product updated successfully.";
  }else{
   data.createdAt=serverTimestamp();
   await addDoc(collection(db,"products"),data);
   $("message").textContent="Product added successfully.";
  }
  resetForm();
  await loadProducts();
 }catch(err){
  $("message").textContent="Error: "+err.message;
 }finally{
  $("saveBtn").disabled=false;
 }
};

async function loadProducts(){
 $("productList").textContent="Loading...";
 try{
  const snap=await getDocs(collection(db,"products"));
  if(snap.empty){
   $("productList").textContent="No products added yet.";
   return;
  }

  $("productList").innerHTML=snap.docs.map(d=>{
   const p=d.data();
   const name=escapeHTML(p.name);
   const image=escapeHTML(p.image);
   return `<div class="product">
    ${image?`<img src="${image}" alt="${name}" onerror="this.style.display='none'">`:""}
    <h3>${name}</h3>
    <p>Category: ${escapeHTML(p.category)}</p>
    <p>Price: ₹${escapeHTML(p.price)} / ${escapeHTML(p.unit)}</p>
    <p>Stock: ${escapeHTML(p.stock)}</p>
    <p>${p.active?"Available":"Unavailable"}</p>
    <div class="actions">
    <button data-edit="${d.id}">EDIT</button>
    <button class="danger" data-delete="${d.id}">DELETE</button>
    </div>
   </div>`;
  }).join("");

  $("productList").querySelectorAll("[data-edit]").forEach(b=>{
   b.onclick=()=>editProduct(b.dataset.edit,snap);
  });
  $("productList").querySelectorAll("[data-delete]").forEach(b=>{
   b.onclick=()=>removeProduct(b.dataset.delete);
  });
 }catch(e){
  $("productList").textContent="Unable to load products: "+e.message;
 }
}

function editProduct(id,snap){
 const p=snap.docs.find(d=>d.id===id)?.data();
 if(!p)return;
 editingId=id;
 $("productId").value=id;
 $("name").value=p.name||"";
 $("category").value=p.category||"Fish";
 $("price").value=p.price||"";
 $("unit").value=p.unit||"kg";
 $("stock").value=p.stock??0;
 $("image").value=p.image||"";
 $("active").checked=p.active!==false;
 $("saveBtn").textContent="UPDATE PRODUCT";
 $("cancelBtn").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function removeProduct(id){
 if(!confirm("Delete this product?"))return;
 try{
  await deleteDoc(doc(db,"products",id));
  $("message").textContent="Product deleted.";
  await loadProducts();
 }catch(e){
  $("message").textContent="Delete failed: "+e.message;
 }
}

function resetForm(){
 editingId=null;
 $("productForm").reset();
 $("productId").value="";
 $("saveBtn").textContent="ADD PRODUCT";
 $("cancelBtn").classList.add("hidden");
}

$("cancelBtn").onclick=resetForm;
</script>
</body>
</html>
